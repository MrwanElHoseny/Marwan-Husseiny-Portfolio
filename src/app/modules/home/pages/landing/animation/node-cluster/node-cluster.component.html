<div id="container" class="cluster-container" #container>
  <ng-container *ngFor="let node of [].constructor(nodeCount)">
    <div class="circle" (animationend)="changePosition($event)"></div>
  </ng-container>
  <ng-container *ngFor="let line of [].constructor(numOfLines)">
    <svg height="100%" width="100%" class="line">
      <line style="stroke: #270655; stroke-width: 1" />
    </svg>
  </ng-container>
</div>

<div class="home-container">
  <div
    class="position-relative d-flex justify-content-center align-items-center h-100"
  >
    <div class="d-block text-center">
      <h1 class="hm-title" id="title">{{ firstName }}</h1>
      <h1 class="hm-title-outline" id="title-outline">{{ lastName }}</h1>
    </div>

    <div class="particles">
      <ngx-particles [id]="id" [options]="particlesOptions"></ngx-particles>
    </div>
    <!-- <node-cluster
      class="node-cluster-1 position-absolute"
      [nodeCount]="10"
    ></node-cluster> -->
    <!-- <node-cluster class="node-cluster-2 position-absolute"></node-cluster>

    <node-cluster class="node-cluster-3 position-absolute"></node-cluster> -->

    <div class="chev-container" id="chevs">
      <div
        class="chev-left-container chev-sway position-absolute"
        id="chev-left"
      >
        <div class="chev-sm">
          <chev-up> </chev-up>
        </div>
      </div>
      <div class="chev-mid-container chev-sway position-absolute" id="chev-mid">
        <chev-up size="lg"> </chev-up>
      </div>
      <div
        class="chev-right-container chev-sway position-absolute"
        id="chev-right"
      >
        <div class="chev-sm">
          <chev-up> </chev-up>
        </div>
      </div>
    </div>
  </div>
</div>
